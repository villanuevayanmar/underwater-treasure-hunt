name: Build browser version

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-web.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-web.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: underwater-web-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install CMake and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.5

      - name: Check compiler
        run: |
          emcc --version
          cmake --version

      - name: Configure browser build
        run: emcmake cmake -S . -B build -G Ninja -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release

      - name: Compile game
        run: cmake --build build --parallel 2

      - name: Check build output
        run: |
          test -s build/underwater_treasure_hunt.html
          test -s build/underwater_treasure_hunt.js
          test -s build/underwater_treasure_hunt.wasm

      - name: Install Chromium test tools
        run: |
          npm install --prefix /tmp/underwater-playwright playwright pngjs
          /tmp/underwater-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Start local web server
        run: |
          python3 -m http.server 8000 --directory build > /tmp/underwater-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8000/underwater_treasure_hunt.html >/dev/null; then
              break
            fi
            sleep 1
          done

      - name: Test desktop and touch-enabled browser layouts
        env:
          NODE_PATH: /tmp/underwater-playwright/node_modules
        run: node .github/scripts/browser-smoke.cjs

      - name: Save browser build and screenshots
        uses: actions/upload-artifact@v7
        with:
          name: underwater-treasure-hunt-web
          path: |
            build/underwater_treasure_hunt.html
            build/underwater_treasure_hunt.js
            build/underwater_treasure_hunt.wasm
            screenshots/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Add genuine browser screenshots to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add browser-tested game screenshots"
            git push
          fi
